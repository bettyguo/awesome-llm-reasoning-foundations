<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Awesome LLM Reasoning Foundations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1023"/>
      <stop offset="100%" stop-color="#1a234c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#f8fafc">
    <text x="60" y="100" font-size="48" font-weight="700">awesome-llm-reasoning-foundations</text>
    <text x="60" y="150" font-size="22" fill="#cbd5e1">a curated, verified map of the theoretical foundations of LLM reasoning</text>
    <g font-size="14" fill="#a3b8d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="60" y="200">expressivity</text>
      <text x="200" y="200">chain-of-thought theory</text>
      <text x="420" y="200">circuit complexity</text>
      <text x="610" y="200">logical characterizations</text>
      <text x="830" y="200">learnability</text>
      <text x="950" y="200">knowledge editing</text>
    </g>
    <line x1="60" y1="225" x2="1140" y2="225" stroke="url(#accent)" stroke-width="2"/>
    <text x="60" y="255" font-size="13" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">curated by Betty Guo (Dongxin Guo) · HKU · CC0 list / MIT code</text>
  </g>
</svg>
